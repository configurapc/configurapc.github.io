# Publica la web en GitHub Pages en cada push a main (sin el panel de precios, scripts ni pruebas).
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar datos y probar el motor
        run: |
          node scripts/validate-data.mjs
          node tests/engine.test.mjs
          node tests/import.test.mjs
      - name: Preparar la web
        run: |
          mkdir _site
          cp -r index.html 404.html favicon.svg robots.txt manifest.webmanifest sw.js assets data pc _site/
          [ -f ads.txt ] && cp ads.txt _site/ || true
          [ -f sitemap.xml ] && cp sitemap.xml _site/ || true
          rm -f _site/assets/admin.js _site/assets/matcher.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
